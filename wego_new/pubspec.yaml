name: wego_marriage
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  # ✅ LANGUAGE SYSTEM
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # UI
  font_awesome_flutter: ^10.7.0
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  badges: ^3.1.2

  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Storage
  shared_preferences: ^2.3.2

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.2.5
  firebase_database: ^11.1.4

  # Auth
  flutter_facebook_auth: ^7.0.1
  local_auth: ^2.3.0
  google_sign_in: ^6.2.1

  # Media
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  camera: ^0.10.5+9
  gal: ^2.3.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Video / Audio / WebRTC
  video_player: ^2.9.2
  video_thumbnail: ^0.5.3
  audioplayers: ^6.1.0
  record: 5.0.5
  flutter_sound: ^9.2.13
  flutter_webrtc: ^0.13.0
  url_launcher: ^6.2.5
  socket_io_client: ^2.0.3+1

  # Cloudinary ✅ NEW
  cloudinary_public: ^0.23.0

  # Utilities
  permission_handler: ^11.3.1
  share_plus: ^10.1.2
  timeago: ^3.6.1
  path_provider: ^2.1.4
  http: ^1.2.2
  provider: ^6.1.2

dependency_overrides:
  record_platform_interface: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/badges/
    - assets/stickers/